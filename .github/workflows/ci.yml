name: CI - Build and Test

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build-and-test:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    
    - name: Restore dependencies
      run: dotnet restore TerrariaOverhaul.sln
      continue-on-error: true
      
    - name: Build mod
      run: dotnet build TerrariaOverhaul.csproj --configuration Debug --no-restore
      continue-on-error: true
      
    - name: Build tests
      run: dotnet build Tests/Tests.csproj --configuration Debug
      
    - name: Run unit tests
      run: dotnet test Tests/Tests.csproj --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"
      
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: Tests/TestResults/**/*.trx
        
    - name: Test Report
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Test Results
        path: Tests/TestResults/**/*.trx
        reporter: dotnet-trx
        fail-on-error: true
