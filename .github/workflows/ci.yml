name: CI - Build and Test

on:
  push:
    branches: [ main, dev, coyote-time, master ]
  pull_request:
    branches: [ main, dev, master ]

jobs:
  test:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    
    - name: Restore test dependencies
      run: dotnet restore Tests/Tests.csproj
      
    - name: Build tests
      run: dotnet build Tests/Tests.csproj --configuration Debug --no-restore
      
    - name: Run unit tests
      run: dotnet test Tests/Tests.csproj --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx" --results-directory TestResults
      
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: TestResults/**/*.trx
        if-no-files-found: warn
        
    - name: Test Report
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: Test Results
        path: TestResults/**/*.trx
        reporter: dotnet-trx
        fail-on-error: false