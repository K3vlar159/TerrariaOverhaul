name: Build and Test

# Full tModLoader CI approach with decompilation and ownership key

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

env:
  TERRARIA_VERSION: 1449
  DOTNET_VERSION: 8.0.203

jobs:
  build-and-test:
    runs-on: windows-latest
    
    steps:
      - name: Checkout mod repository
        uses: actions/checkout@v4
        with:
          path: TerrariaOverhaul
      
      - name: Checkout tModLoader dev repository
        uses: actions/checkout@v4
        with:
          repository: tModLoader/tModLoader
          ref: 1.4.4
          path: tModLoader
      
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '${{env.DOTNET_VERSION}}'
      
      - name: Download Terraria Server
        shell: bash
        working-directory: tModLoader
        run: |
          echo "Downloading Terraria Server v$TERRARIA_VERSION..."
          curl -s -L https://terraria.org/api/download/pc-dedicated-server/terraria-server-$TERRARIA_VERSION.zip -o terrariaserver.zip
          unzip -q terrariaserver.zip
          
          echo "Adding SteelSeriesEngineWrapper.dll..."
          cp patches/Terraria/Terraria/Libraries/Common/SteelSeriesEngineWrapper.dll ./$TERRARIA_VERSION/Windows/SteelSeriesEngineWrapper.dll
      
      - name: Generate ownership key from Terraria files
        shell: pwsh
        working-directory: tModLoader
        run: |
          Write-Host "Generating ownership key from Terraria Server files..."
          $terrariaExe = Get-Item "$env:TERRARIA_VERSION/Windows/TerrariaServer.exe"
          $hash = Get-FileHash -Path $terrariaExe.FullName -Algorithm SHA256
          $hexKey = $hash.Hash.Substring(0, 64)
          Write-Host "Generated key: $hexKey"
          echo "GENERATED_KEY=$hexKey" >> $env:GITHUB_ENV
      
      - name: Run tModLoader setup
        shell: pwsh
        working-directory: tModLoader
        run: |
          $hexKey = "$env:GENERATED_KEY"
          Write-Host "Using generated key for decompilation"
          
          Write-Host "Running setup-cli decompile..."
          bash -c "./setup-cli.bat decompile --key `"$hexKey`" --terraria-steam-dir ./$env:TERRARIA_VERSION/Windows --tml-dev-steam-dir steam_build --plain-progress -f --strict"
          
          if ($LASTEXITCODE -ne 0) {
            Write-Host "ERROR: Decompile failed"
            exit $LASTEXITCODE
          }
          
          Write-Host "Running setup-cli regen-source..."
          bash -c "./setup-cli.bat regen-source --plain-progress -f --strict"
      
      - name: Build tModLoader framework
        shell: bash
        working-directory: tModLoader
        run: |
          echo "Building tModLoader framework..."
          dotnet build src/tModLoader/Terraria/Terraria.csproj -c Release --nologo -v q
          
          mkdir -p steam_build
      
      - name: Copy mod to ModSources
        shell: bash
        run: |
          echo "Setting up mod in tModLoader ModSources..."
          mkdir -p tModLoader/steam_build/ModSources
          cp -r TerrariaOverhaul tModLoader/steam_build/ModSources/
      
      - name: Build TerrariaOverhaul mod
        shell: bash
        working-directory: tModLoader/steam_build/ModSources/TerrariaOverhaul
        run: |
          echo "Building TerrariaOverhaul mod..."
          dotnet build TerrariaOverhaul.csproj -c Release --nologo
      
      - name: Run Tests
        shell: bash
        working-directory: tModLoader/steam_build/ModSources/TerrariaOverhaul
        run: |
          echo "Running unit tests..."
          dotnet test Tests/Tests.csproj --verbosity normal
      
      - name: Run Benchmarks
        shell: bash
        working-directory: tModLoader/steam_build/ModSources/TerrariaOverhaul
        run: |
          echo "Running performance benchmarks..."
          dotnet run --project Benchmarks/Benchmarks.csproj -c Release
        continue-on-error: true
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: TerrariaOverhaul-Build
          path: tModLoader/steam_build/ModSources/TerrariaOverhaul/bin/

# This workflow mirrors tModLoader's official CI approach
# Requires TERRARIA_OWNERSHIP_KEY secret in repository settings
