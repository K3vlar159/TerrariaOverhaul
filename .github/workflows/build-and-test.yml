name: Build and Test

# Simplified approach: Use tModLoader's pre-built release artifacts
# No ownership key needed - downloads public release from GitHub

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

env:
  TMODLOADER_VERSION: v2024.10.2.4
  DOTNET_VERSION: 8.0.x

jobs:
  build-and-test:
    runs-on: windows-latest
    
    steps:
      - name: Checkout mod repository
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '${{env.DOTNET_VERSION}}'
      
      - name: Download tModLoader release
        shell: pwsh
        run: |
          Write-Host "Downloading tModLoader $env:TMODLOADER_VERSION..."
          $releaseUrl = "https://github.com/tModLoader/tModLoader/releases/download/$env:TMODLOADER_VERSION/tModLoader.zip"
          Invoke-WebRequest -Uri $releaseUrl -OutFile tModLoader.zip
          
          Write-Host "Extracting tModLoader..."
          Expand-Archive -Path tModLoader.zip -DestinationPath tModLoader -Force
          
          Write-Host "tModLoader extracted successfully"
          Get-ChildItem tModLoader | Select-Object Name
      
      - name: Setup tModLoader environment
        shell: pwsh
        run: |
          Write-Host "Creating ModSources directory..."
          $modSourcesPath = "tModLoader\ModSources\TerrariaOverhaul"
          New-Item -ItemType Directory -Force -Path $modSourcesPath
          
          Write-Host "Copying mod files..."
          Copy-Item -Path ".\*" -Destination $modSourcesPath -Recurse -Force -Exclude ".git","tModLoader","bin","obj"
          
          Write-Host "Setting up tModLoader.targets reference..."
          $targetsFile = "tModLoader\tMLMod.targets"
          if (Test-Path $targetsFile) {
            Copy-Item $targetsFile -Destination "tModLoader\tModLoader.targets" -Force
          }
      
      - name: Build TerrariaOverhaul mod
        shell: pwsh
        working-directory: tModLoader/ModSources/TerrariaOverhaul
        run: |
          Write-Host "Building TerrariaOverhaul mod..."
          dotnet build TerrariaOverhaul.csproj -c Release --nologo -v minimal
        continue-on-error: true
      
      - name: Run Tests
        shell: pwsh
        run: |
          Write-Host "Running unit tests..."
          dotnet test Tests/Tests.csproj --verbosity normal
      
      - name: Run Benchmarks
        shell: pwsh
        run: |
          Write-Host "Running performance benchmarks..."
          dotnet run --project Benchmarks/Benchmarks.csproj -c Release
        continue-on-error: true
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            **/TestResults/**
            BenchmarkDotNet.Artifacts/**

# Note: This simplified approach downloads pre-built tModLoader release
# Works without ownership key but may have limitations for full mod compilation
# Tests and benchmarks should work if they don't require full tModLoader build
