name: Build and Test

# Simplified approach: Use tModLoader's pre-built release artifacts
# No ownership key needed - downloads public release from GitHub

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

env:
  TMODLOADER_VERSION: v2025.09.3.3
  DOTNET_VERSION: 8.0.x

jobs:
  build-and-test:
    runs-on: windows-latest
    
    steps:
      - name: Checkout mod repository
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '${{env.DOTNET_VERSION}}'
      
      - name: Clone tModLoader dev repository
        uses: actions/checkout@v4
        with:
          repository: tModLoader/tModLoader
          ref: 1.4.4
          path: tModLoader-dev
      
      - name: Create symbolic link to tModLoader
        shell: pwsh
        run: |
          Write-Host "Creating tModLoader symlink..."
          # Create parent directory for symlink
          $parentDir = Split-Path -Parent $PWD
          $symlinkPath = Join-Path $parentDir "tModLoader"
          
          # Remove if exists
          if (Test-Path $symlinkPath) {
            Remove-Item $symlinkPath -Recurse -Force
          }
          
          # Create directory junction (works better on Windows than symlink)
          New-Item -ItemType Junction -Path $symlinkPath -Target "$PWD\tModLoader-dev" -Force
          
          Write-Host "tModLoader dev environment linked at: $symlinkPath"
      
      - name: Build TerrariaOverhaul mod
        shell: pwsh
        run: |
          Write-Host "Building TerrariaOverhaul mod..."
          Write-Host "Current directory: $PWD"
          Write-Host "Checking tModLoader.targets..."
          Get-ChildItem ..\tModLoader -ErrorAction SilentlyContinue | Select-Object Name
          
          dotnet build TerrariaOverhaul.csproj -c Release --nologo -v detailed
        continue-on-error: true
      
      - name: Run Tests
        shell: pwsh
        run: |
          Write-Host "Running unit tests..."
          dotnet test Tests/Tests.csproj --verbosity normal
      
      - name: Run Benchmarks
        shell: pwsh
        run: |
          Write-Host "Running performance benchmarks..."
          dotnet run --project Benchmarks/Benchmarks.csproj -c Release
        continue-on-error: true
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            **/TestResults/**
            BenchmarkDotNet.Artifacts/**

# Note: This simplified approach downloads pre-built tModLoader release
# Works without ownership key but may have limitations for full mod compilation
# Tests and benchmarks should work if they don't require full tModLoader build
