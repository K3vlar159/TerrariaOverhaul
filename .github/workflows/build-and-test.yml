name: Build and Test

# Simplified approach: Use tModLoader's pre-built release artifacts
# No ownership key needed - downloads public release from GitHub

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

env:
  TMODLOADER_VERSION: v2025.09.3.3
  DOTNET_VERSION: 8.0.x

jobs:
  build-and-test:
    runs-on: windows-latest
    
    steps:
      - name: Checkout mod repository
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '${{env.DOTNET_VERSION}}'
      
      - name: Clone tModLoader dev repository
        uses: actions/checkout@v4
        with:
          repository: tModLoader/tModLoader
          ref: 1.4.4
          path: tModLoader-dev
      
      - name: Setup tModLoader targets file
        shell: pwsh
        run: |
          Write-Host "Setting up tModLoader.targets..."
          $parentDir = Split-Path -Parent $PWD
          $targetsSource = Join-Path $PWD "tModLoader-dev\tMLMod.targets"
          $targetsDestination = Join-Path $parentDir "tModLoader.targets"
          
          Write-Host "Source: $targetsSource"
          Write-Host "Destination: $targetsDestination"
          
          if (Test-Path $targetsSource) {
            Copy-Item $targetsSource $targetsDestination -Force
            Write-Host "tModLoader.targets copied successfully"
          } else {
            Write-Host "Warning: tMLMod.targets not found in tModLoader-dev"
            Get-ChildItem "tModLoader-dev" | Select-Object Name
          }
      
      - name: Build TerrariaOverhaul mod
        shell: pwsh
        run: |
          Write-Host "Building TerrariaOverhaul mod..."
          Write-Host "Current directory: $PWD"
          Write-Host "Checking tModLoader.targets..."
          Get-ChildItem ..\tModLoader -ErrorAction SilentlyContinue | Select-Object Name
          
          dotnet build TerrariaOverhaul.csproj -c Release --nologo -v detailed
        continue-on-error: true
      
      - name: Run Tests
        shell: pwsh
        run: |
          Write-Host "Running unit tests..."
          dotnet test Tests/Tests.csproj --verbosity normal
      
      - name: Run Benchmarks
        shell: pwsh
        run: |
          Write-Host "Running performance benchmarks..."
          dotnet run --project Benchmarks/Benchmarks.csproj -c Release
        continue-on-error: true
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            **/TestResults/**
            BenchmarkDotNet.Artifacts/**

# Note: This simplified approach downloads pre-built tModLoader release
# Works without ownership key but may have limitations for full mod compilation
# Tests and benchmarks should work if they don't require full tModLoader build
