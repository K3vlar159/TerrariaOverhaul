name: Tests Only (No Build)

# This workflow runs unit tests and benchmarks that don't require tModLoader compilation
# Full mod compilation is not possible on GitHub runners without tModLoader installation

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      
      # Tests project can build independently since it only references public APIs
      - name: Restore Tests dependencies
        run: dotnet restore Tests/Tests.csproj
      
      - name: Build Tests project
        run: dotnet build Tests/Tests.csproj --no-restore
        
      - name: Run unit tests
        run: dotnet test Tests/Tests.csproj --no-build --verbosity normal
      
      # Benchmarks
      - name: Restore Benchmarks dependencies
        run: dotnet restore Benchmarks/Benchmarks.csproj
        
      - name: Build Benchmarks project
        run: dotnet build Benchmarks/Benchmarks.csproj --no-restore -c Release
        
      - name: Run benchmarks
        run: dotnet run --project Benchmarks/Benchmarks.csproj --no-build -c Release
        continue-on-error: true
      
      # Code quality checks
      - name: Check code formatting
        run: dotnet format --verify-no-changes --verbosity diagnostic
        continue-on-error: true

# Note: Full mod compilation requires:
# - tModLoader installation (not available on GitHub runners)
# - Terraria ownership verification
# - Decompiled source files
# 
# Consider self-hosted runner or local testing for full builds
